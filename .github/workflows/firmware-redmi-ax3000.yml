name: Redmi AX3000 firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: Build stable QSDK image
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Checkout HomeNet
        uses: actions/checkout@v4
        with:
          path: homenet

      - name: Load pinned build metadata
        run: cat homenet/firmware/redmi-ax3000/stable.env >> "$GITHUB_ENV"

      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: openwrt
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: Configure source
        working-directory: openwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../homenet/firmware/redmi-ax3000/stable.config .config
          make defconfig
          grep -qx 'CONFIG_TARGET_DEVICE_ipq50xx_arm_DEVICE_redmi_ax3000=y' .config
          grep -qx 'CONFIG_PACKAGE_wpad-wolfssl=y' .config
          grep -qx 'CONFIG_PACKAGE_usteer=y' .config
          grep -qx '# CONFIG_PACKAGE_wpad-basic-wolfssl is not set' .config

      - name: Download sources
        working-directory: openwrt
        run: make -j16 download

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)"

      - name: Verify and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          target="openwrt/bin/targets/ipq50xx/arm"
          manifest="$(find "${target}" -type f -name '*redmi_ax3000*.manifest' -print -quit)"
          image="$(find "${target}" -type f -name '*redmi_ax3000*factory.ubi' -print -quit)"
          test -n "${manifest}"
          test -n "${image}"
          grep -q '^wpad-wolfssl ' "${manifest}"
          grep -q '^usteer ' "${manifest}"
          ! grep -q '^wpad-basic-wolfssl ' "${manifest}"
          mkdir -p artifact
          cp "${manifest}" "${image}" artifact/
          cp openwrt/bin/targets/ipq50xx/arm/{config.buildinfo,feeds.buildinfo,version.buildinfo} artifact/
          cp homenet/firmware/redmi-ax3000/{stable.env,stable.config} artifact/
          (cd artifact && sha256sum * > SHA256SUMS)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000-stable-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
