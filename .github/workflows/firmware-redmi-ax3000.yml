name: Redmi AX3000 firmware

on:
  workflow_dispatch:
    inputs:
      track:
        description: Firmware track
        required: true
        default: stable
        type: choice
        options:
          - stable
          - candidate

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.track }} image
    runs-on: ubuntu-22.04
    env:
      TRACK: ${{ inputs.track }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Checkout HomeNet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: homenet

      - name: Load pinned build metadata
        run: |
          set -euo pipefail
          case "${TRACK}" in
            stable|candidate) source_track="${TRACK}" ;;
            *) exit 1 ;;
          esac
          echo "SOURCE_TRACK=${source_track}" >> "$GITHUB_ENV"
          cat "homenet/firmware/redmi-ax3000/${source_track}.env" >> "$GITHUB_ENV"

      - name: Checkout pinned upstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: openwrt
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libelf-dev libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev zstd libzstd-dev coccinelle

      - name: Configure source
        working-directory: openwrt
        run: |
          set -euo pipefail
          if [ "${TRACK}" = candidate ]; then
            git apply ../homenet/firmware/redmi-ax3000/patches/0001-home-net-cr8809-single-rootfs.patch
            dts=target/linux/qualcommax/dts/ipq5018-redmi-ax3000-ubootmod.dts
            common=target/linux/qualcommax/dts/ipq5018-cr880x.dtsi
            upgrade=target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/platform.sh
            grep -Fq 'reg = <0x00a80000 0x7480000>;' "${dts}"
            grep -Fq 'nand-ecc-step-size = <512>;' "${common}"
            grep -Fq 'nand-ecc-strength = <8>;' "${common}"
            grep -Fq 'qcom,ath11k-fw-memory-mode = <2>;' "${common}"
            grep -Fq '&tz_region' "${common}"
            sed -n '/xiaomi,redmi-ax3000-ubootmod)/,/;;/p' "${upgrade}" > /tmp/candidate-upgrade-block
            grep -Fq 'CI_UBIPART="rootfs"' /tmp/candidate-upgrade-block
            ! grep -Fq 'fw_setenv' /tmp/candidate-upgrade-block
            cp ../homenet/firmware/redmi-ax3000/candidate.feeds.conf feeds.conf
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp "../homenet/firmware/redmi-ax3000/${SOURCE_TRACK}.config" .config
          make defconfig
          grep -qx 'CONFIG_PACKAGE_usteer=y' .config || {
            echo 'usteer was not selected' >&2
            exit 1
          }
          if [ "${TRACK}" = candidate ]; then
            grep -qx 'CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_redmi-ax3000-ubootmod=y' .config || {
              echo 'xiaomi_redmi-ax3000-ubootmod target was not selected' >&2
              exit 1
            }
            grep -qx 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config || {
              echo 'candidate initramfs was not selected' >&2
              exit 1
            }
            grep -qx 'CONFIG_PACKAGE_wpad-mbedtls=y' .config || {
              echo 'wpad-mbedtls was not selected' >&2
              exit 1
            }
            grep -qx 'CONFIG_PACKAGE_relayd=y' .config || {
              echo 'relayd was not selected' >&2
              exit 1
            }
            grep -qx 'CONFIG_PACKAGE_watchcat=y' .config || {
              echo 'watchcat was not selected' >&2
              exit 1
            }
            if grep -qx 'CONFIG_PACKAGE_wpad-basic-mbedtls=y' .config; then
              echo 'wpad-basic-mbedtls must not be selected' >&2
              exit 1
            fi
            if grep -Eq '^CONFIG_(PACKAGE_nss-tools-dwmac|PACKAGE_MAC80211_NSS_SUPPORT|ATH11K_NSS_SUPPORT)=y' .config; then
              echo 'NSS acceleration must stay disabled on the room AP candidate' >&2
              exit 1
            fi
          else
            grep -qx 'CONFIG_TARGET_DEVICE_ipq50xx_arm_DEVICE_redmi_ax3000=y' .config || {
              echo 'redmi_ax3000 target was not selected' >&2
              exit 1
            }
            grep -qx 'CONFIG_PACKAGE_wpad-wolfssl=y' .config || {
              echo 'wpad-wolfssl was not selected' >&2
              exit 1
            }
            if grep -qx 'CONFIG_PACKAGE_wpad-basic-wolfssl=y' .config; then
              echo 'wpad-basic-wolfssl must not be selected' >&2
              exit 1
            fi
          fi

      - name: Download sources
        working-directory: openwrt
        run: make -j16 download

      - name: Build tools
        working-directory: openwrt
        run: make -j"$(nproc)" tools/install

      - name: Build toolchain
        working-directory: openwrt
        run: make -j"$(nproc)" toolchain/install

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)"

      - name: Verify and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ "${TRACK}" = candidate ]; then
            target="openwrt/bin/targets/qualcommax/ipq50xx"
            pattern='*xiaomi_redmi-ax3000-ubootmod*'
          else
            target="openwrt/bin/targets/ipq50xx/arm"
            pattern='*redmi_ax3000*'
          fi
          manifest="$(find "${target}" -type f -name "${pattern}.manifest" -print -quit)"
          test -n "${manifest}"
          grep -q '^usteer ' "${manifest}"
          mkdir -p artifact
          if [ "${TRACK}" = candidate ]; then
            initramfs="$(find "${target}" -type f -name "${pattern}initramfs-uImage.itb" -print -quit)"
            sysupgrade="$(find "${target}" -type f -name "${pattern}sysupgrade.bin" -print -quit)"
            factory="$(find "${target}" -type f -name "${pattern}factory.ubi" -print -quit)"
            test -n "${initramfs}" && test -n "${sysupgrade}" && test -n "${factory}"
            grep -q '^wpad-mbedtls ' "${manifest}"
            ! grep -q '^wpad-basic-mbedtls ' "${manifest}"
            ! grep -Eq '^(nss-tools-dwmac|kmod-qca-nss)' "${manifest}"
            cp "${manifest}" "${initramfs}" "${sysupgrade}" "${factory}" artifact/
          else
            image="$(find "${target}" -type f -name "${pattern}factory.ubi" -print -quit)"
            test -n "${image}"
            grep -q '^wpad-wolfssl ' "${manifest}"
            ! grep -q '^wpad-basic-wolfssl ' "${manifest}"
            cp "${manifest}" "${image}" artifact/
          fi
          cp "${target}"/{config.buildinfo,feeds.buildinfo,version.buildinfo} artifact/
          cp "homenet/firmware/redmi-ax3000/${SOURCE_TRACK}.env" artifact/
          cp "homenet/firmware/redmi-ax3000/${SOURCE_TRACK}.config" artifact/
          if [ "${TRACK}" = candidate ]; then
            cp homenet/firmware/redmi-ax3000/patches/0001-home-net-cr8809-single-rootfs.patch artifact/
            cp homenet/firmware/redmi-ax3000/candidate.feeds.conf artifact/
          fi
          (
            cd artifact
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redmi-ax3000-${{ inputs.track }}-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
